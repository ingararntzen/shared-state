<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - Application Detail</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #283548;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0284c7;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-purple: #a855f7;

            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* HEADER */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.65rem;
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .nav-back-link:hover {
            color: #fff;
            border-color: var(--accent-primary);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 1.5rem auto 0;
            padding: 0 1.5rem;
        }

        .app-title-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-info {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .app-icon {
            width: 42px;
            height: 42px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--accent-purple);
        }

        .app-name-heading {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .service-section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .resources-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .resource-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.2s ease;
        }

        .resource-card:hover {
            border-color: var(--border-highlight);
        }

        .resource-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .resource-name {
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-success);
        }

        .resource-path {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.85rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover));
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="brand-section">
                <a href="index.html" class="nav-back-link">← Overview</a>
                <div class="brand-title">Application Resources</div>
            </div>
            <a href="monitor.html" class="nav-back-link">📊 Collection Monitor</a>
        </div>
    </header>

    <div class="container">

        <!-- APP TITLE CARD -->
        <div class="app-title-card">
            <div class="app-title-info">
                <div class="app-icon">📦</div>
                <div>
                    <div class="app-name-heading" id="appNameHeading">Loading...</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);" id="appMetaSub">Application Details</div>
                </div>
            </div>
        </div>

        <!-- RESOURCES CONTAINER -->
        <div id="servicesContainer">
            <div class="empty-state">Loading application services and resources...</div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const appName = urlParams.get('app') || '';

        document.getElementById('appNameHeading').textContent = appName ? `Application: ${appName}` : 'No Application Specified';

        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                return data.ok ? data.data : null;
            } catch (e) {
                console.error("Fetch error for", url, e);
                return null;
            }
        }

        async function loadAppDetails() {
            if (!appName) {
                document.getElementById('servicesContainer').innerHTML = '<div class="empty-state">No application specified in query string (?app=name).</div>';
                return;
            }

            // Fetch services for this application: GET /apps/<app>/
            const services = await fetchJSON(`/apps/${encodeURIComponent(appName)}/`) || [];
            const container = document.getElementById('servicesContainer');

            if (services.length === 0) {
                container.innerHTML = `<div class="empty-state">No services or resources found for application '${appName}'.</div>`;
                return;
            }

            let html = '';
            for (const srv of services) {
                // Fetch channels under /apps/<app>/<service>/
                const channels = await fetchJSON(`/apps/${encodeURIComponent(appName)}/${encodeURIComponent(srv)}/`) || [];
                
                html += `
                    <div style="margin-bottom: 2rem;">
                        <div class="service-section-title">⚙️ Service: ${srv}</div>
                        <div class="resources-grid">
                `;

                if (channels.length === 0) {
                    html += `<div class="empty-state" style="padding: 1.5rem;">No channels/resources registered under service '${srv}'.</div>`;
                } else {
                    for (const chnl of channels) {
                        const path = `/${appName}/${srv}/${chnl}`;
                        const monitorUrl = `monitor.html?service=${encodeURIComponent(srv)}&app=${encodeURIComponent(appName)}&chnl=${encodeURIComponent(chnl)}`;
                        html += `
                            <div class="resource-card">
                                <div class="resource-info">
                                    <div class="resource-name">📢 ${chnl}</div>
                                    <div class="resource-path">Path: ${path}</div>
                                </div>
                                <a href="${monitorUrl}" class="btn-action">Monitor Collection →</a>
                            </div>
                        `;
                    }
                }

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        loadAppDetails();
    </script>
</body>
</html>
