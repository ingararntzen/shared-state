<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - Client Subscriptions</title>
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #283548;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0284c7;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-purple: #a855f7;

            --radius-sm: 6px;
            --radius-md: 10px;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: 2.5rem;
        }

        /* HEADER */
        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.65rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.65rem;
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .nav-back-link:hover {
            color: #fff;
            border-color: var(--accent-primary);
        }

        .container {
            max-width: 1200px;
            margin: 1.25rem auto 0;
            padding: 0 1.5rem;
        }

        .page-title-banner {
            margin-bottom: 1.25rem;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .section-block {
            margin-bottom: 1.75rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.65rem;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* LIST & COLUMNS */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .list-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.65rem 1.25rem;
            display: grid;
            grid-template-columns: 1fr 170px 24px;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        .list-row.clickable {
            cursor: pointer;
        }

        .list-row.clickable:hover {
            border-color: var(--border-highlight);
            background: var(--bg-surface);
            transform: translateX(3px);
        }

        .col-name {
            font-family: monospace;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--accent-warning);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-stats {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.85rem;
            font-size: 0.8rem;
            color: var(--accent-primary);
            white-space: nowrap;
            font-weight: 600;
        }

        .col-arrow {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="brand-section">
                <div class="brand-logo">SS</div>
                <div class="brand-title">SharedState</div>
            </div>
            <a href="index.html" class="nav-back-link">← Home</a>
        </div>
    </header>

    <div class="container">

        <!-- PAGE TITLE BANNER -->
        <div class="page-title-banner">
            <h1 class="page-title">Client Subscriptions: <span id="clientAddrSpan" style="color: var(--accent-primary); font-family: monospace;">Loading...</span></h1>
        </div>

        <!-- SUBSCRIPTIONS SECTION -->
        <div class="section-block">
            <div class="section-header">
                <h2 class="section-title">
                    Resource Subscriptions
                    <span class="count-badge" id="subsCountBadge">0</span>
                </h2>
            </div>

            <div class="list-container" id="subsList">
                <div class="empty-state">Loading subscriptions...</div>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clientAddr = urlParams.get('client') || '';

        document.getElementById('clientAddrSpan').textContent = clientAddr || 'None';
        document.title = clientAddr ? `SharedState - Subscriptions for ${clientAddr}` : 'SharedState - Client Subscriptions';

        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                return data.ok ? data.data : null;
            } catch (e) {
                console.error("Fetch error for", url, e);
                return null;
            }
        }

        async function loadSubscriptions() {
            if (!clientAddr) {
                document.getElementById('subsList').innerHTML = '<div class="empty-state">No WebSocket client address specified in query string (?client=addr).</div>';
                return;
            }

            const allSubs = await fetchJSON('/subs') || [];
            const clientSubs = allSubs.filter(s => s.client === clientAddr);

            document.getElementById('subsCountBadge').textContent = clientSubs.length;

            const listContainer = document.getElementById('subsList');
            if (clientSubs.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">No active path subscriptions for client '${clientAddr}'.</div>`;
                return;
            }

            let html = '';
            clientSubs.forEach(sub => {
                const monitorUrl = `resource.html?path=${encodeURIComponent(sub.path)}`;
                html += `
                    <a href="${monitorUrl}" class="list-row clickable">
                        <div class="col-name">${sub.path}</div>
                        <div class="col-stats">
                            <span>Resource View</span>
                        </div>
                        <div class="col-arrow">→</div>
                    </a>
                `;
            });

            listContainer.innerHTML = html;
        }

        loadSubscriptions();
    </script>
</body>
</html>
