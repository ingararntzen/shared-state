<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - Overview</title>
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #283548;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0284c7;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-purple: #a855f7;

            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: 2.5rem;
        }

        /* HEADER */
        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1200px;
            margin: 1.25rem auto 0;
            padding: 0 1.5rem;
        }

        /* SECTION HEADERS */
        .section-block {
            margin-bottom: 1.75rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.65rem;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* LIST & SHARED INVISIBLE COLUMNS (CSS GRID) */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .list-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.65rem 1.25rem;
            display: grid;
            grid-template-columns: 55px 140px 220px 1fr 170px 24px;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        .list-row.clickable {
            cursor: pointer;
        }

        .list-row.clickable:hover {
            border-color: var(--border-highlight);
            background: var(--bg-surface);
            transform: translateX(3px);
        }

        /* COLUMN STYLING */
        .col-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            text-align: center;
        }

        .col-name {
            font-family: 'Outfit', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-ident {
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-stats {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.85rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .col-arrow {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .protocol-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            width: 48px;
            text-align: center;
            display: inline-block;
        }

        .tag-http {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .tag-ws {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .tag-log {
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-purple);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .meta-val {
            font-family: monospace;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .empty-state {
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="brand-section">
                <div class="brand-logo">SS</div>
                <div class="brand-title">SharedState</div>
            </div>
        </div>
    </header>

    <div class="container">

        <!-- SECTION 1: SERVER ENDPOINTS -->
        <div class="section-block">
            <div class="section-header">
                <h2 class="section-title">Server Endpoints</h2>
            </div>
            <div class="list-container">
                <!-- HTTP SERVER -->
                <div class="list-row">
                    <div class="col-icon">
                        <span class="protocol-tag tag-http">HTTP</span>
                    </div>
                    <div class="col-name">HTTP Server</div>
                    <div class="col-ident" id="httpEndpointUrl">http://0.0.0.0:9000</div>
                    <div class="col-desc"><span class="protocol-tag tag-log" style="font-size: 0.68rem; padding: 0.1rem 0.4rem; width: auto; margin-right: 0.35rem;">LOG</span><span class="meta-val" id="httpLogFile">logs/http.log</span></div>
                    <div class="col-stats"></div>
                    <div class="col-arrow"></div>
                </div>

                <!-- WS SERVER (CLICKABLE -> ws.html) -->
                <a href="ws.html" class="list-row clickable">
                    <div class="col-icon">
                        <span class="protocol-tag tag-ws">WS</span>
                    </div>
                    <div class="col-name">WebSocket Server</div>
                    <div class="col-ident" id="wsEndpointUrl">ws://0.0.0.0:9001</div>
                    <div class="col-desc"><span class="protocol-tag tag-log" style="font-size: 0.68rem; padding: 0.1rem 0.4rem; width: auto; margin-right: 0.35rem;">LOG</span><span class="meta-val" id="wsLogFile">logs/ws.log</span></div>
                    <div class="col-stats"></div>
                    <div class="col-arrow">→</div>
                </a>
            </div>
        </div>

        <!-- SECTION 2: STORAGE SERVICES -->
        <div class="section-block">
            <div class="section-header">
                <h2 class="section-title">Storage Services <span class="count-badge" id="servicesCountBadge">0</span></h2>
            </div>
            <div class="list-container" id="servicesList">
                <div class="empty-state">Loading registered storage services...</div>
            </div>
        </div>

        <!-- SECTION 3: APPLICATIONS -->
        <div class="section-block">
            <div class="section-header">
                <h2 class="section-title">Applications <span class="count-badge" id="appsCountBadge">0</span></h2>
            </div>
            <div class="list-container" id="appsList">
                <div class="empty-state">Loading applications...</div>
            </div>
        </div>

    </div>

    <script>
        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                return data.ok ? data.data : null;
            } catch (e) {
                console.error("Fetch error for", url, e);
                return null;
            }
        }

        async function loadServerConfig() {
            const config = await fetchJSON('/config');
            if (config) {
                const host = config.host || "0.0.0.0";
                document.getElementById('httpEndpointUrl').textContent = `http://${host}:${config.http_port || 9000}`;
                document.getElementById('wsEndpointUrl').textContent = `ws://${host}:${config.ws_port || 9001}`;
                document.getElementById('httpLogFile').textContent = config.http_log || "logs/http.log";
                document.getElementById('wsLogFile').textContent = config.ws_log || "logs/ws.log";
            }
        }

        async function loadStorageServicesList() {
            const services = await fetchJSON('/services') || [];
            document.getElementById('servicesCountBadge').textContent = services.length;

            const listContainer = document.getElementById('servicesList');
            if (services.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No storage services registered.</div>';
                return;
            }

            let html = '';
            services.forEach(s => {
                const srvName = typeof s === 'object' ? s.name : s;
                const srvPath = typeof s === 'object' ? s.path : `/services/${srvName}`;
                const desc = typeof s === 'object' ? s.description : '';
                const appCount = typeof s === 'object' ? s.apps : 0;
                const resCount = typeof s === 'object' ? s.resources : 0;

                html += `
                    <div class="list-row">
                        <div class="col-icon">⚙️</div>
                        <div class="col-name" style="color: var(--accent-primary);">${srvName}</div>
                        <div class="col-ident">${srvPath}</div>
                        <div class="col-desc">${desc}</div>
                        <div class="col-stats">
                            <span>apps: <span class="meta-val">${appCount}</span></span>
                            <span>resources: <span class="meta-val">${resCount}</span></span>
                        </div>
                        <div class="col-arrow"></div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        async function loadApplicationsList() {
            const apps = await fetchJSON('/apps') || [];
            document.getElementById('appsCountBadge').textContent = apps.length;

            const listContainer = document.getElementById('appsList');
            if (apps.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No active applications found.</div>';
                return;
            }

            let html = '';
            apps.forEach(appObj => {
                const appName = typeof appObj === 'object' ? appObj.name : appObj;
                const totalResources = typeof appObj === 'object' ? appObj.resources : 0;

                html += `
                    <a href="app.html?app=${encodeURIComponent(appName)}" class="list-row clickable">
                        <div class="col-icon">📦</div>
                        <div class="col-name">${appName}</div>
                        <div class="col-ident">/apps/${appName}</div>
                        <div class="col-desc"></div>
                        <div class="col-stats">
                            <span>resources: <span class="meta-val">${totalResources}</span></span>
                        </div>
                        <div class="col-arrow">→</div>
                    </a>
                `;
            });

            listContainer.innerHTML = html;
        }

        async function initPage() {
            await Promise.all([
                loadServerConfig(),
                loadStorageServicesList(),
                loadApplicationsList()
            ]);
        }

        // Initial Load
        initPage();
    </script>
</body>
</html>
