<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SharedState Minimal Counter</title>
    <script type="module">
        import { SharedStateClient } from "/dist/sharedstate.es.js";

        const client = new SharedStateClient("ws://127.0.0.1:9000");

        const { counter } = client.load({
            counter: { type: "Integer", path: "/app/mitems/minimal/counter" }
        });

        const counterEl = document.querySelector("#counter");

        counter.on("change", (val) => {
            counterEl.textContent = val;
        }, { init: true });

        document.querySelector("#incBtn").onclick = () => counter.inc(1);
        document.querySelector("#decBtn").onclick = () => counter.dec(1);
        document.querySelector("#zeroBtn").onclick = () => counter.set(0);
    </script>
</head>
<body>
    <h1 id="counter">0</h1>
    <p>
        <button id="incBtn">Increment</button>
        <button id="decBtn">Decrement</button>
        <button id="zeroBtn">Zero</button>
    </p>
</body>
</html>
