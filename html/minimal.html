<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SharedState Minimal Counter</title>
    <script type="module">
        import { SharedStateClient } from "/dist/sharedstate.es.js";

        const client = new SharedStateClient("ws://127.0.0.1:9000");
        const coll = client.acquire_collection("/app/mitems/minimal");
        const counterEl = document.querySelector("#counter");

        function getVal() {
            const item = coll.get_item("counter");
            return item !== undefined && typeof item.state === "number" ? item.state : 0;
        }

        function render() {
            counterEl.textContent = getVal();
        }

        coll.add_callback(render);

        document.querySelector("#incBtn").onclick = () => {
            coll.update_items({ insert: [{ id: "counter", state: getVal() + 1 }] });
        };

        document.querySelector("#decBtn").onclick = () => {
            coll.update_items({ insert: [{ id: "counter", state: getVal() - 1 }] });
        };

        document.querySelector("#zeroBtn").onclick = () => {
            coll.update_items({ insert: [{ id: "counter", state: 0 }] });
        };

        render();
    </script>
</head>
<body>
    <h1 id="counter">0</h1>
    <p>
        <button id="incBtn">Increment</button>
        <button id="decBtn">Decrement</button>
        <button id="zeroBtn">Zero</button>
    </p>
</body>
</html>
