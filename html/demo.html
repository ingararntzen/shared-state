<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - Map Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-card: rgba(22, 27, 38, 0.7);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 1.5rem;
            background-image: 
                radial-gradient(circle at 15% 15%, var(--accent-glow) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--bg-card-border);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--bg-card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            color: white;
        }

        .viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .viewer::-webkit-scrollbar {
            width: 6px;
        }
        .viewer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .item-card {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            transition: all 0.2s ease;
            animation: fadeIn 0.3s ease-out;
        }

        .item-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .item-info {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 1.5rem;
            flex: 1;
            min-width: 0;
        }

        .item-id {
            font-size: 0.85rem;
            color: #a5b4fc;
            font-weight: 600;
            min-width: 120px;
            flex-shrink: 0;
        }

        .item-state {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-main);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-sm-danger {
            padding: 0.35rem 0.65rem;
            font-size: 0.8rem;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .empty-state {
            flex: 1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SharedMap Viewer</h1>
            <span class="badge" id="countBadge">0 Items</span>
        </header>

        <div class="controls">
            <button class="btn-primary" id="addBtn">+ Add Entry</button>
            <button class="btn-secondary" id="changeBtn">⚡ Change Random</button>
            <button class="btn-danger" id="resetBtn">🗑️ Delete All</button>
        </div>

        <div class="viewer" id="viewer">
            <div class="empty-state">Loading map data...</div>
        </div>
    </div>

    <script type="module">
        import { SharedStateClient } from "../dist/sharedstate.es.js";

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        const wsUrl = `ws://${location.hostname || "127.0.0.1"}:${location.port || 9000}`;
        const client = new SharedStateClient(wsUrl);

        // Load SharedMap via client.load() with optimistic enabled for 0ms optimistic updates
        const { demoMap } = client.load({
            demoMap: { type: "Map", path: "/app/mitems/chnl", optimistic: true }
        });

        const viewerEl = document.querySelector("#viewer");
        const countBadgeEl = document.querySelector("#countBadge");

        function updateDOM(changes = {}) {
            const { insert = [], remove = [], reset = false } = changes;
            const items = demoMap.get_items();
            countBadgeEl.textContent = `${items.length} ${items.length === 1 ? 'Entry' : 'Entries'}`;

            if (items.length === 0) {
                viewerEl.innerHTML = `<div class="empty-state">Map is empty. Click "+ Add Entry" to populate.</div>`;
                return;
            }

            const emptyEl = viewerEl.querySelector(".empty-state");
            if (emptyEl) {
                emptyEl.remove();
            }

            if (reset) {
                viewerEl.innerHTML = "";
            }

            // Handle removals
            remove.forEach((id) => {
                const card = viewerEl.querySelector(`[data-id="${CSS.escape(id)}"]`);
                if (card) {
                    card.remove();
                }
            });

            // Handle inserts / updates
            insert.forEach((item) => {
                const val = item.state !== undefined ? item.state : item.value;
                const formattedVal = typeof val === "object" ? JSON.stringify(val) : val;

                let card = viewerEl.querySelector(`[data-id="${CSS.escape(item.id)}"]`);
                if (card) {
                    // Update existing element in-place
                    const stateEl = card.querySelector(".item-state");
                    if (stateEl) {
                        stateEl.textContent = formattedVal;
                    }
                } else {
                    // Create and append new DOM node
                    card = document.createElement("div");
                    card.className = "item-card";
                    card.setAttribute("data-id", item.id);

                    const info = document.createElement("div");
                    info.className = "item-info";
                    info.innerHTML = `
                        <span class="item-id">${item.id}</span>
                        <span class="item-state">${formattedVal}</span>
                    `;

                    const delBtn = document.createElement("button");
                    delBtn.className = "btn-danger btn-sm-danger";
                    delBtn.textContent = "Delete";
                    delBtn.onclick = () => {
                        demoMap.delete(item.id);
                    };

                    card.appendChild(info);
                    card.appendChild(delBtn);
                    viewerEl.appendChild(card);
                }
            });
        }

        // Subscribe to map changes using eventify stateful listener
        demoMap.on("change", (changes) => {
            updateDOM(changes);
        }, { init: true });

        // Event Listeners
        document.querySelector("#addBtn").onclick = () => {
            const idx = getRandomInt(100);
            demoMap.set(`key_${idx}`, `val_${idx}`);
        };

        document.querySelector("#changeBtn").onclick = () => {
            const items = demoMap.get_items();
            if (items.length === 0) return;
            const target = items[getRandomInt(items.length)];
            const new_idx = getRandomInt(100);
            demoMap.set(target.id, `val_${new_idx}`);
        };

        document.querySelector("#resetBtn").onclick = () => {
            const items = demoMap.get_items();
            items.forEach(item => demoMap.delete(item.id));
        };
    </script>
</body>
</html>
