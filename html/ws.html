<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - WebSocket Status</title>
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #283548;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0284c7;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-purple: #a855f7;

            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* HEADER */
        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.65rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .nav-back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.65rem;
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .nav-back-link:hover {
            color: #fff;
            border-color: var(--accent-primary);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 1.25rem auto 0;
            padding: 0 1.5rem;
        }

        /* WS BANNER */
        .ws-banner-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .ws-banner-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .ws-icon {
            width: 36px;
            height: 36px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--accent-success);
        }

        .ws-endpoint-url {
            font-family: monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-success);
        }

        .ws-meta-pills {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.6rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .pill-lbl {
            color: var(--text-muted);
        }

        .pill-val {
            font-family: monospace;
            color: var(--accent-primary);
            font-weight: 600;
        }

        /* CLIENT CARDS */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .clients-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .client-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .client-header {
            padding: 0.85rem 1.25rem;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .client-addr {
            font-family: monospace;
            font-weight: 600;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .subs-container {
            padding: 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sub-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.55rem 0.85rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .sub-path {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent-warning);
        }

        .btn-inspect {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.75rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover));
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-inspect:hover {
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-connected {
            background-color: var(--accent-success);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .protocol-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
        }

        .tag-log {
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-purple);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .count-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* LIST & COLUMNS */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .list-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.65rem 1.25rem;
            display: grid;
            grid-template-columns: 55px 220px 180px 1fr 170px 24px;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        .list-row.clickable {
            cursor: pointer;
        }

        .list-row.clickable:hover {
            border-color: var(--border-highlight);
            background: var(--bg-surface);
            transform: translateX(3px);
        }

        .col-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            text-align: center;
        }

        .col-name {
            font-family: 'Outfit', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-ident {
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-stats {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.85rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .col-arrow {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .page-title-banner {
            margin-bottom: 1.25rem;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="brand-section">
                <div class="brand-logo">SS</div>
                <div class="brand-title">SharedState</div>
            </div>
            <a href="index.html" class="nav-back-link">← Home</a>
        </div>
    </header>

    <div class="container">

        <!-- PAGE TITLE BANNER -->
        <div class="page-title-banner">
            <h1 class="page-title">WebSocket Server View</h1>
        </div>

        <!-- WS ENDPOINT BANNER -->
        <div class="ws-banner-card">
            <div class="ws-banner-info">
                <div class="ws-endpoint-url" id="wsEndpointUrl">ws://0.0.0.0:9001</div>
                <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.65rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 20px;">
                    <div class="status-dot status-connected"></div>
                    <span style="font-size: 0.78rem; font-weight: 600; color: var(--accent-success);">Connected</span>
                </div>
            </div>
            <div class="ws-meta-pills">
                <div class="meta-pill" style="display: flex; align-items: center; gap: 0.4rem;">
                    <span class="protocol-tag tag-log" style="font-size: 0.68rem; padding: 0.1rem 0.4rem; width: auto;">LOG</span>
                    <span class="pill-val" id="wsLogFile">logs/ws.log</span>
                </div>
            </div>
        </div>

        <!-- CONNECTED CLIENTS SECTION -->
        <div class="section-block" style="margin-top: 1.75rem;">
            <div class="section-header">
                <h2 class="section-title">
                    Connected Clients
                    <span class="count-badge" id="wsClientsCount">0</span>
                </h2>
            </div>

            <div class="list-container" id="clientsList">
                <div class="empty-state">Loading active connections...</div>
            </div>
        </div>

    </div>

    <script>
        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                return data.ok ? data.data : null;
            } catch (e) {
                console.error("Fetch error for", url, e);
                return null;
            }
        }

        async function loadConfigOnce() {
            const config = await fetchJSON('/config');
            if (config) {
                const host = config.host || "0.0.0.0";
                const port = config.ws_port || 9001;
                document.getElementById('wsEndpointUrl').textContent = `ws://${host}:${port}`;
                document.getElementById('wsLogFile').textContent = config.ws_log || "logs/ws.log";
            }
        }

        async function loadWSConnections() {
            const connections = await fetchJSON('/connections') || [];

            document.getElementById('wsClientsCount').textContent = connections.length;

            const listContainer = document.getElementById('clientsList');
            if (connections.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No active WebSocket client connections at this moment.</div>';
                return;
            }

            let html = '';
            connections.forEach(clientAddr => {
                html += `
                    <a href="subs.html?client=${encodeURIComponent(clientAddr)}" class="list-row clickable">
                        <div class="col-icon">💻</div>
                        <div class="col-name" style="font-family: monospace;">${clientAddr}</div>
                        <div class="col-ident">/clients/${clientAddr}</div>
                        <div class="col-desc"></div>
                        <div class="col-stats">
                            <span>View Subscriptions</span>
                        </div>
                        <div class="col-arrow">→</div>
                    </a>
                `;
            });

            listContainer.innerHTML = html;
        }

        loadConfigOnce();
        loadWSConnections();
        setInterval(loadWSConnections, 3000);
    </script>
</body>
</html>
