<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - Resource View</title>
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #283548;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0284c7;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --accent-warning: #f59e0b;
            --accent-purple: #a855f7;

            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* HEADER */
        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.65rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .nav-back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.65rem;
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .nav-back-link:hover {
            color: #fff;
            border-color: var(--accent-primary);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-connecting {
            background-color: var(--accent-warning);
            box-shadow: 0 0 8px var(--accent-warning);
        }

        .status-disconnected {
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .status-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* CONTAINER */
        .container {
            max-width: 1200px;
            margin: 1.25rem auto 0;
            padding: 0 1.5rem;
        }

        /* TOP ACTION BANNER */
        .admin-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .resource-info-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .resource-heading {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .resource-path-sub {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .btn-clear-resource {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.9rem;
            background-color: var(--accent-red);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-clear-resource:hover {
            background-color: var(--accent-red-hover);
        }

        /* MAIN GRID LAYOUT */
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 800px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-header {
            padding: 0.85rem 1.25rem;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* TABLE STYLING */
        .table-container {
            flex: 1;
            overflow-x: auto;
            position: relative;
            min-height: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0.65rem 1rem;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 0.65rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr.selected {
            background: rgba(56, 189, 248, 0.12) !important;
        }

        tr.clickable-row {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        tr.clickable-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-item-delete {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            border-radius: 4px;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .btn-item-delete:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .no-data {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
        }

        /* DETAIL INSPECTOR */
        .inspector-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
        }

        pre {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1rem;
            color: var(--accent-primary);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* PATH NAV PANEL */
        .path-nav-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-top: 1.5rem;
        }

        .path-form {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .path-input {
            flex: 1;
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.85rem;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .path-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn-go {
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .page-title-banner {
            margin-bottom: 1.25rem;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="brand-section">
                <div class="brand-logo">SS</div>
                <div class="brand-title">SharedState</div>
            </div>
            <a href="index.html" class="nav-back-link">← Home</a>
        </div>
    </header>

    <div class="container">

        <!-- PAGE TITLE BANNER -->
        <div class="page-title-banner">
            <h1 class="page-title">Resource View</h1>
        </div>

        <!-- ADMIN TOP BANNER -->
        <div class="admin-banner">
            <div class="resource-info-group">
                <span class="resource-path-sub" id="resourcePathHeader" style="font-family: monospace; font-size: 1.05rem; font-weight: 600; color: var(--accent-primary);">/app/service/resource</span>
            </div>

            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="status-container">
                    <div class="status-dot status-disconnected" id="connStateDot"></div>
                    <span class="status-text" id="connStateText">Disconnected</span>
                </div>
                <button class="btn-clear-resource" id="btnClearResource">
                    🗑️ Clear all Items
                </button>
            </div>
        </div>

        <!-- MAIN GRID: TABLE + INSPECTOR -->
        <div class="main-grid">
            <!-- ITEMS TABLE CARD -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        Items
                        <span class="count-badge" id="itemsCountBadge">0</span>
                    </div>
                </div>

                <div class="table-container">
                    <table id="itemsTable">
                        <thead>
                            <tr>
                                <th style="width: 36px; text-align: center;">Del</th>
                                <th>Item ID</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Filled in dynamically -->
                        </tbody>
                    </table>
                    <div class="no-data" id="emptyState">
                        <p>No items found in this collection.</p>
                    </div>
                </div>
            </div>

            <!-- INSPECTOR CARD -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Item Inspector</div>
                </div>
                <div class="inspector-body" id="inspectorBody">
                    <div style="color: var(--text-muted); font-size: 0.85rem;">Select an item from the table to view details.</div>
                </div>
            </div>
        </div>

        </div>

    </div>

    <!-- SharedState JS SDK Bundle -->
    <script src="libs/sharedstate.iife.js"></script>
    <script>
        const SharedStateSDK = window.SHAREDSTATE || window.SharedState || {};
        const SharedStateClient = SharedStateSDK.SharedStateClient;

        let client = null;
        let activeCollection = null;
        let itemsList = [];
        let selectedItemId = null;

        const urlParams = new URLSearchParams(window.location.search);
        const pathParam = urlParams.get("path");
        const srvParam = urlParams.get("service");
        const appParam = urlParams.get("app");
        const chnlParam = urlParams.get("chnl");

        let currentResourcePath = "";
        if (pathParam) {
            currentResourcePath = pathParam.startsWith("/") ? pathParam : "/" + pathParam;
        } else if (srvParam && appParam && chnlParam) {
            currentResourcePath = `/${appParam}/${srvParam}/${chnlParam}`;
        }

        document.getElementById('resourcePathHeader').textContent = currentResourcePath || "None";

        // Initialize SharedState Client
        function initClient() {
            updateConnectionStatus("connecting");
            
            const host = window.location.hostname || "localhost";
            const wsPort = urlParams.get("port") || "9001";
            const wsUrl = `ws://${host}:${wsPort}`;

            try {
                client = new SharedStateClient(wsUrl, { debug: true });
                
                client.connectedPromise().then(() => {
                    updateConnectionStatus("connected");
                    if (currentResourcePath) {
                        connectResource(currentResourcePath);
                    }
                });

                client.on_disconnect = () => updateConnectionStatus("disconnected");
                client.on_connect = () => updateConnectionStatus("connected");

            } catch (err) {
                console.error("Failed to connect:", err);
                updateConnectionStatus("disconnected");
            }
        }

        function updateConnectionStatus(status) {
            const dot = document.getElementById("connStateDot");
            const text = document.getElementById("connStateText");
            dot.className = "status-dot";
            if (status === "connected") {
                dot.classList.add("status-connected");
                text.textContent = "Connected";
            } else if (status === "connecting") {
                dot.classList.add("status-connecting");
                text.textContent = "Connecting";
            } else {
                dot.classList.add("status-disconnected");
                text.textContent = "Disconnected";
            }
        }

        function connectResource(path) {
            try {
                activeCollection = client.acquire_collection(path);
                updateItems(activeCollection.get_items());

                activeCollection.add_callback(() => {
                    updateItems(activeCollection.get_items());
                });
            } catch (e) {
                console.error("Error acquiring collection:", e);
            }
        }

        function updateItems(items) {
            itemsList = [...items];
            document.getElementById("itemsCountBadge").textContent = `${itemsList.length}`;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            const emptyState = document.getElementById("emptyState");
            tbody.innerHTML = "";

            if (!currentResourcePath || itemsList.length === 0) {
                emptyState.style.display = "block";
                return;
            }

            emptyState.style.display = "none";

            itemsList.forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "clickable-row";
                if (item.id === selectedItemId) {
                    tr.classList.add("selected");
                }

                tr.innerHTML = `
                    <td style="text-align: center;">
                        <button class="btn-item-delete" title="Delete item" onclick="deleteSingleItem('${item.id}', event)">✕</button>
                    </td>
                    <td style="font-family: var(--font-mono); color: var(--accent-primary); font-weight: 500;">${item.id}</td>
                `;

                tr.onclick = () => {
                    selectedItemId = item.id;
                    renderTable();
                    renderInspector(item);
                };

                tbody.appendChild(tr);
            });
        }

        function renderInspector(item) {
            const body = document.getElementById("inspectorBody");
            if (!item) {
                body.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">Select an item from the table to view details.</div>';
                return;
            }
            body.innerHTML = `<pre>${JSON.stringify(item, null, 2)}</pre>`;
        }

        function deleteSingleItem(itemId, event) {
            event.stopPropagation();
            if (activeCollection && itemId) {
                activeCollection.update_items({ remove: [itemId] });
            }
        }

        // Clear Resource Handler
        document.getElementById("btnClearResource").addEventListener("click", () => {
            if (!currentResourcePath || !activeCollection) {
                alert("No active resource selected.");
                return;
            }
            if (confirm(`Are you sure you want to clear resource '${currentResourcePath}'?`)) {
                activeCollection.update_items({ reset: true });
            }
        });

        initClient();
    </script>
</body>
</html>
