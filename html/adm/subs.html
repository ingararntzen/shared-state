<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - Client Subscriptions</title>
    <link rel="stylesheet" href="adm.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <a href="index.html" class="brand-section">
                <div class="brand-logo">SS</div>
                <div class="brand-title">SharedState</div>
            </a>
        </div>
    </header>

    <div class="container">

        <!-- PAGE TITLE BANNER -->
        <div class="page-title-banner">
            <h1 class="page-title">Client Subscriptions: <span id="clientAddrSpan" style="color: var(--accent-primary); font-family: monospace;">Loading...</span></h1>
        </div>

        <!-- SUBSCRIPTIONS SECTION -->
        <div class="section-block">
            <div class="section-header">
                <h2 class="section-title">
                    Resource Subscriptions
                    <span class="count-badge" id="subsCountBadge">0</span>
                </h2>
            </div>

            <div class="list-container" id="subsList">
                <div class="empty-state">Loading subscriptions...</div>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clientAddr = urlParams.get('client') || '';

        document.getElementById('clientAddrSpan').textContent = clientAddr || 'None';
        document.title = clientAddr ? `SharedState - Subscriptions for ${clientAddr}` : 'SharedState - Client Subscriptions';

        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                return data.ok ? data.data : null;
            } catch (e) {
                console.error("Fetch error for", url, e);
                return null;
            }
        }

        async function loadSubscriptions() {
            if (!clientAddr) {
                document.getElementById('subsList').innerHTML = '<div class="empty-state">No WebSocket client address specified in query string (?client=addr).</div>';
                return;
            }

            const allSubs = await fetchJSON('/api/subs') || await fetchJSON('/subs') || [];
            const clientSubs = allSubs.filter(s => s.client === clientAddr);

            document.getElementById('subsCountBadge').textContent = clientSubs.length;

            const listContainer = document.getElementById('subsList');
            if (clientSubs.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">No active path subscriptions for client '${clientAddr}'.</div>`;
                return;
            }

            let html = '';
            clientSubs.forEach(sub => {
                const monitorUrl = `resource.html?path=${encodeURIComponent(sub.path)}`;
                html += `
                    <a href="${monitorUrl}" class="list-row clickable">
                        <div class="col-icon">📡</div>
                        <div class="col-name" style="grid-column: 2 / 5; font-family: monospace; font-size: 0.92rem; color: var(--accent-warning);">${sub.path}</div>
                        <div class="col-stats">
                            <span>Resource View</span>
                        </div>
                        <div class="col-arrow">→</div>
                    </a>
                `;
            });

            listContainer.innerHTML = html;
        }

        loadSubscriptions();
    </script>
</body>
</html>
