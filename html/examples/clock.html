<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharedState - Server Clock Monitor</title>
    <link rel="stylesheet" href="examples.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Server Clock Sync</h1>
            <span class="badge" id="syncStatus">Live Monotonic Clock</span>
        </header>

        <div class="metric-display" style="padding: 1.5rem 1rem;">
            <div class="metric-val" id="clock" style="font-size: 2.2rem;">--</div>
            <div class="metric-label">Monotonic Wall Clock (now)</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="metric-display" style="padding: 1rem;">
                <div class="metric-val" id="latest_trans" style="font-size: 1.35rem; color: var(--accent-primary);">--
                </div>
                <div class="metric-label">Latest Raw Ping Delay</div>
            </div>
            <div class="metric-display" style="padding: 1rem;">
                <div class="metric-val" id="latest_skew" style="font-size: 1.35rem; color: var(--accent-primary);">--
                </div>
                <div class="metric-label">Latest Raw Ping Skew</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="metric-display" style="padding: 1rem;">
                <div class="metric-val" id="trans" style="font-size: 1.35rem; color: var(--accent-warning);">--</div>
                <div class="metric-label">Filtered Delay (Min RTT)</div>
            </div>
            <div class="metric-display" style="padding: 1rem;">
                <div class="metric-val" id="skew" style="font-size: 1.35rem; color: var(--accent-warning);">--</div>
                <div class="metric-label">Filtered Skew (Min RTT)</div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="metric-display" style="padding: 1rem;">
                <div class="metric-val" id="trans_var" style="font-size: 1.2rem; color: #a0aec0;">--</div>
                <div class="metric-label">Delay Jitter (StdDev / Range)</div>
            </div>
            <div class="metric-display" style="padding: 1rem;">
                <div class="metric-val" id="skew_var" style="font-size: 1.2rem; color: #a0aec0;">--</div>
                <div class="metric-label">Skew Jitter (StdDev / Range)</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { SharedStateClient } from "../../client/index.js";

        const wsUrl = `ws://${location.hostname || "127.0.0.1"}:${location.port || 9000}`;
        const client = new SharedStateClient(wsUrl);

        const elem_clock = document.querySelector("#clock");
        const elem_latest_trans = document.querySelector("#latest_trans");
        const elem_latest_skew = document.querySelector("#latest_skew");
        const elem_trans = document.querySelector("#trans");
        const elem_skew = document.querySelector("#skew");
        const elem_trans_var = document.querySelector("#trans_var");
        const elem_skew_var = document.querySelector("#skew_var");

        setInterval(() => {
            if (client.clock) {
                elem_clock.textContent = client.clock.now() ? client.clock.now().toFixed(6) : "--";
                elem_latest_trans.textContent = client.clock.latest_trans !== undefined ? `${(client.clock.latest_trans * 1000).toFixed(3)} ms` : "--";
                elem_latest_skew.textContent = client.clock.latest_skew !== undefined ? `${(client.clock.latest_skew * 1000).toFixed(3)} ms` : "--";
                elem_trans.textContent = client.clock.trans !== undefined ? `${(client.clock.trans * 1000).toFixed(3)} ms` : "--";
                elem_skew.textContent = client.clock.skew !== undefined ? `${(client.clock.skew * 1000).toFixed(3)} ms` : "--";

                const tStd = (client.clock.trans_std * 1000).toFixed(3);
                const tRng = (client.clock.trans_range * 1000).toFixed(3);
                elem_trans_var.textContent = client.clock.trans !== undefined ? `±${tStd} ms (Δ ${tRng} ms)` : "--";

                const sStd = (client.clock.skew_std * 1000).toFixed(3);
                const sRng = (client.clock.skew_range * 1000).toFixed(3);
                elem_skew_var.textContent = client.clock.skew !== undefined ? `±${sStd} ms (Δ ${sRng} ms)` : "--";
            }
        }, 50);
    </script>
</body>

</html>
