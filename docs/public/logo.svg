<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Small Rounded Corners Purple Background (rx=6) -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#6366F1" />
  
  <!-- Size 1 (Original Scale) Connector Lines -->
  <path d="M 32 44 L 16 20" stroke="#C7D2FE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 32 44 L 32 16" stroke="#C7D2FE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 32 44 L 48 20" stroke="#C7D2FE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  
  <!-- Size 1 Server Node (r=10.0) -->
  <circle cx="32" cy="44" r="10.0" fill="#FFFFFF" />
  
  <!-- Size 1 Client Nodes (r=4.8) -->
  <circle cx="16" cy="20" r="4.8" fill="#FFFFFF" />
  <circle cx="32" cy="16" r="4.8" fill="#FFFFFF" />
  <circle cx="48" cy="20" r="4.8" fill="#FFFFFF" />
